name: spark-lnbits-test

services:
  sidecar:
    build: .
    environment:
      SPARK_NETWORK: ${SPARK_NETWORK:-MAINNET}
      SPARK_MNEMONIC: ${SPARK_MNEMONIC:?Run npm run stack:init first}
      SPARK_SIDECAR_API_KEY: ${SPARK_SIDECAR_API_KEY:?Run npm run stack:init first}
      SPARK_SIDECAR_HOST: 0.0.0.0
      SPARK_SIDECAR_PORT: '8765'
    ports:
      - '127.0.0.1:${SPARK_LOCAL_PORT:-8765}:8765'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  lnbits:
    image: lnbits/lnbits:v1.6.2
    depends_on:
      sidecar:
        condition: service_healthy
    environment:
      LNBITS_HOST: 0.0.0.0
      LNBITS_PORT: '5000'
      LNBITS_DATA_FOLDER: /app/data
      LNBITS_BACKEND_WALLET_CLASS: SparkL2Wallet
      LNBITS_ADMIN_UI: 'true'
      LNBITS_SITE_TITLE: 'LNbits Spark Test'
      SPARK_L2_NETWORK: ${SPARK_NETWORK:-MAINNET}
      SPARK_L2_EXTERNAL_ENDPOINT: http://sidecar:8765
      SPARK_L2_EXTERNAL_API_KEY: ${SPARK_SIDECAR_API_KEY:?Run npm run stack:init first}
      LNBITS_RESERVE_FEE_MIN: '5000'
      AUTH_HTTPS_ONLY: 'false'
      FIRST_INSTALL_TOKEN: ${FIRST_INSTALL_TOKEN:?Run npm run stack:init first}
    ports:
      - '127.0.0.1:${LNBITS_LOCAL_PORT:-5100}:5000'
    volumes:
      - lnbits-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'uv',
          '--offline',
          'run',
          '--no-sync',
          'python',
          '-c',
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=5); assert r.status == 200 and r.headers.get_content_type() == 'application/json'"
        ]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  lnbits-data:
